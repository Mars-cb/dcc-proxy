name: Build and release deb

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check package and release versions
        id: version
        run: |
          python3 ci/version.py --ref "$GITHUB_REF" --run-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Test version ordering
        run: python3 -m unittest discover -s tests -p 'test_ci_version.py'

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DCC_PROXY_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Cache verified core and geodata
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: cores
          key: core-geodata-${{ matrix.arch }}-${{ hashFiles('packaging/mihomo.version', 'packaging/geodata.json', 'tools/prepare-core.sh') }}
      - name: Prepare fixed Qt 5.11 / DTK 5.6 environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ci
          load: true
          tags: dcc-proxy-builder:ci
          cache-from: type=gha,scope=uos20-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=uos20-${{ matrix.arch }}
      - name: Build, test and verify deb
        run: |
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/ci-home -e GITHUB_SHA -e DCC_PROXY_PACKAGE_VERSION \
            -v "$GITHUB_WORKSPACE:/project" -w /project dcc-proxy-builder:ci \
            bash ci/build-package.sh 2>&1 | tee package-build.log
      - name: Capture builder failure details
        if: failure()
        run: |
          docker buildx history logs > builder.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          source = Path('package-build.log') if Path('package-build.log').exists() else Path('builder.log')
          all_lines = source.read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(all_lines) if ' error:' in line or 'CMake Error' in line or 'undefined reference' in line or 'FAIL!' in line or 'AssertionError' in line or 'Traceback (most recent' in line]
          if not markers:
              markers = [i for i, line in enumerate(all_lines) if 'FAILED:' in line]
          if markers:
              first = markers[0]
              lines = all_lines[max(0, first - 1):first + 12] + all_lines[-3:]
          else:
              lines = all_lines[-25:]
          text = '\n'.join(lines).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Builder diagnostics::' + text)
          PY
      - name: Keep validated packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dcc-proxy-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/SHA256SUMS-*
            dist/build-info-*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Keep failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            build-*/Testing/Temporary/LastTest.log
            builder.log
            package-build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [version, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download both architectures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: dcc-proxy-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable Release
        run: bash ci/publish-release.sh
